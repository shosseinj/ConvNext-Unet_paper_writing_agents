<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#242424"/></marker>
    <style>
      .title { font: 700 23px Arial, sans-serif; fill: #151515; }
      .label { font: 700 17px Arial, sans-serif; fill: #151515; }
      .small { font: 14px Arial, sans-serif; fill: #303030; }
      .box { stroke: #242424; stroke-width: 1.8; rx: 5; fill: #f4f4f4 !important; }
      .arrow { stroke: #242424; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="450" fill="#ffffff"/>
  <text x="35" y="42" class="title">Multi-Scale Context module</text>
  <rect x="35" y="175" width="160" height="75" class="box" fill="#f3f3f3"/>
  <text x="115" y="207" text-anchor="middle" class="label">B0</text>
  <text x="115" y="230" text-anchor="middle" class="small">768 channels</text>
  <path d="M195 212 L245 212" class="arrow"/>
  <rect x="245" y="175" width="180" height="75" class="box" fill="#f7f7f7"/>
  <text x="335" y="207" text-anchor="middle" class="label">1 x 1 projection</text>
  <text x="335" y="230" text-anchor="middle" class="small">96 channels</text>
  <path d="M425 212 L490 212" class="arrow"/>
  <path d="M490 212 L490 110 L550 110" class="arrow"/>
  <path d="M490 212 L490 175 L550 175" class="arrow"/>
  <path d="M490 212 L490 240 L550 240" class="arrow"/>
  <path d="M490 212 L490 305 L550 305" class="arrow"/>
  <rect x="550" y="75" width="190" height="60" class="box" fill="#f3f3f3"/>
  <text x="645" y="101" text-anchor="middle" class="label">DWConv d = 1</text>
  <text x="645" y="121" text-anchor="middle" class="small">local context</text>
  <rect x="550" y="145" width="190" height="60" class="box" fill="#f3f3f3"/>
  <text x="645" y="171" text-anchor="middle" class="label">DWConv d = 3</text>
  <text x="645" y="191" text-anchor="middle" class="small">expanded context</text>
  <rect x="550" y="215" width="190" height="60" class="box" fill="#f3f3f3"/>
  <text x="645" y="241" text-anchor="middle" class="label">DWConv d = 5</text>
  <text x="645" y="261" text-anchor="middle" class="small">broader context</text>
  <rect x="550" y="285" width="190" height="60" class="box" fill="#f3f3f3"/>
  <text x="645" y="311" text-anchor="middle" class="label">GAP + 1 x 1</text>
  <text x="645" y="331" text-anchor="middle" class="small">global context</text>
  <path d="M740 105 L805 212" class="arrow"/>
  <path d="M740 175 L805 212" class="arrow"/>
  <path d="M740 245 L805 212" class="arrow"/>
  <path d="M740 315 L805 212" class="arrow"/>
  <rect x="805" y="175" width="165" height="75" class="box" fill="#f7f7f7"/>
  <text x="887" y="207" text-anchor="middle" class="label">Concatenate</text>
  <text x="887" y="230" text-anchor="middle" class="small">4 x 96 channels</text>
  <path d="M970 212 L1020 212" class="arrow"/>
  <rect x="1020" y="175" width="145" height="75" class="box" fill="#f3f3f3"/>
  <text x="1092" y="207" text-anchor="middle" class="label">Project + add</text>
  <text x="1092" y="230" text-anchor="middle" class="small">B, 768 channels</text>
  <text x="35" y="405" class="small">All branches are convolutional. The global branch is broadcast to the bottleneck spatial size before concatenation.</text>
</svg>
